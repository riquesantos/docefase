<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Doce Fase</title>
<meta name="theme-color" content="#FBE9DF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Doce Fase">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --vinho:#8E1B24; --vinho-esc:#6E131B; --vinho-claro:#B8424C;
  --creme:#FBE9DF; --creme-esc:#F3D6C6; --papel:#FFF8F4;
  --texto:#3A1A1C; --suave:#8A6A66; --linha:#EBCFC0;
  --verde:#2E7D4F; --laranja:#C46A12;
  --raio:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--creme);color:var(--texto);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;
  overscroll-behavior:none}
.logo{font-family:"Didot","Bodoni 72",Georgia,serif;color:var(--vinho);font-weight:700;letter-spacing:-.5px;line-height:.85}
header{position:sticky;top:0;z-index:5;background:var(--creme);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--linha)}
header .logo{font-size:26px}
header .sub{font-size:10px;letter-spacing:2px;color:var(--vinho-claro);text-transform:uppercase}
header h1{margin:0 0 0 auto;font-size:17px;font-weight:600;color:var(--vinho)}
main{padding:14px 16px calc(env(safe-area-inset-bottom) + 96px);max-width:640px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--papel);border-top:1px solid var(--linha);
  display:flex;padding:6px 4px calc(env(safe-area-inset-bottom) + 6px)}
nav button{flex:1;border:0;background:none;color:var(--suave);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-family:inherit}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--vinho);font-weight:600}
.card{background:var(--papel);border-radius:var(--raio);padding:14px;margin-bottom:12px;box-shadow:0 1px 0 var(--linha)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--suave);font-size:13px}
.big{font-size:26px;font-weight:700;color:var(--vinho)}
.btn{border:0;border-radius:12px;padding:13px 16px;font-size:16px;font-weight:600;font-family:inherit;background:var(--vinho);color:#fff;width:100%}
.btn:active{background:var(--vinho-esc)}
.btn.sec{background:var(--creme-esc);color:var(--vinho)}
.btn.mini{width:auto;padding:8px 12px;font-size:14px;white-space:nowrap;flex:none}
.btn.perigo{background:none;color:var(--vinho);border:1px solid var(--vinho)}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 80px);z-index:9;width:58px;height:58px;border-radius:50%;
  border:0;background:var(--vinho);color:#fff;font-size:32px;line-height:1;box-shadow:0 6px 18px rgba(142,27,36,.35)}
.list .item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--linha)}
.list .item:last-child{border-bottom:0}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--creme-esc);color:var(--vinho)}
.tag.ok{background:#DDF0E3;color:var(--verde)}
.tag.fiado{background:#FBE3CC;color:var(--laranja)}
.av{width:40px;height:40px;border-radius:50%;background:var(--creme-esc);color:var(--vinho);display:grid;place-items:center;font-weight:700;flex:none}
label{display:block;font-size:13px;color:var(--suave);margin:12px 0 5px}
input,select,textarea{width:100%;font-size:16px;font-family:inherit;padding:12px;border-radius:12px;border:1px solid var(--linha);background:#fff;color:var(--texto)}
input:focus,select:focus{outline:2px solid var(--vinho-claro);border-color:transparent}
.seg{display:flex;background:var(--creme-esc);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:9px;font-size:14px;font-family:inherit;color:var(--vinho)}
.seg button.on{background:var(--papel);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:38px;height:38px;border-radius:50%;border:0;background:var(--creme-esc);color:var(--vinho);font-size:22px;font-weight:700}
.qty b{min-width:22px;text-align:center;font-size:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--papel);border-radius:var(--raio);padding:12px 14px}
.stat .v{font-size:21px;font-weight:700;color:var(--vinho);margin-top:2px}
.stat.verde .v{color:var(--verde)}
.bar{height:10px;border-radius:99px;background:var(--creme-esc);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--vinho);border-radius:99px}
.chart{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:10px}
.chart div{flex:1;background:var(--vinho-claro);border-radius:4px 4px 0 0;min-height:2px}
.chart div.hoje{background:var(--vinho)}
.empty{text-align:center;color:var(--suave);padding:30px 10px}
.empty .logo{font-size:40px;opacity:.25;margin-bottom:8px}
h2{font-size:15px;margin:18px 0 8px;color:var(--vinho);text-transform:uppercase;letter-spacing:1px}
h2:first-child{margin-top:4px}
/* modal */
.sheet-bg{position:fixed;inset:0;background:rgba(58,26,28,.45);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--papel);border-radius:22px 22px 0 0;
  max-height:92vh;overflow:auto;padding:8px 16px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(100%);transition:transform .25s}
.sheet.open{transform:none}
.sheet .grip{width:40px;height:5px;border-radius:9px;background:var(--linha);margin:4px auto 10px}
.sheet h3{margin:0 0 6px;color:var(--vinho);font-size:20px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:var(--texto);color:#fff;
  padding:10px 16px;border-radius:99px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.search{margin-bottom:12px}
.total-line{display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:700;color:var(--vinho);margin:14px 0}
</style>
</head>
<body>
<header>
  <div><div class="logo">doce<br>fase</div></div>
  <h1 id="titulo">Vendas</h1>
</header>
<main id="app"></main>
<button class="fab" id="fab" aria-label="Adicionar">+</button>

<nav id="nav">
  <button data-tab="vendas" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/></svg>Vendas</button>
  <button data-tab="clientes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M17 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"/></svg>Clientes</button>
  <button data-tab="produtos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M3 12h18"/></svg>Brownies</button>
  <button data-tab="gastos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16l-3-2-3 2-2-2-2 2-3-2-3 2z"/><path d="M8 9h8M8 13h5"/></svg>Gastos</button>
  <button data-tab="relatorios"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 16v-4M12 16V8M17 16v-7"/></svg>Relatórios</button>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
// ---------- dados ----------
const KEY = 'docefase-v1';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const hojeISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };

const padrao = () => ({
  produtos: [
    { id: uid(), nome: 'Doce de leite', preco: 10, ativo: true },
    { id: uid(), nome: 'Brigadeiro', preco: 10, ativo: true },
    { id: uid(), nome: 'Leite Ninho', preco: 10, ativo: true },
    { id: uid(), nome: 'Dois amores', preco: 10, ativo: true },
  ],
  clientes: [], vendas: [], gastos: [],
});

let db;
try { db = JSON.parse(localStorage.getItem(KEY)) || padrao(); } catch { db = padrao(); }
const salvar = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch { toast('Não consegui salvar!'); } };
salvar();

const brl = v => (v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const num = s => parseFloat(String(s).replace(/\./g, '').replace(',', '.')) || 0;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dataBR = iso => { const [a, m, d] = iso.split('-'); return `${d}/${m}/${a}`; };
const prod = id => db.produtos.find(p => p.id === id);
const cli = id => db.clientes.find(c => c.id === id);
const endereco = c => [c.bloco && 'Bl ' + c.bloco, c.apto && 'Ap ' + c.apto].filter(Boolean).join(' · ');
const totalVenda = v => v.itens.reduce((s, i) => s + i.qtd * i.preco, 0);
const qtdVenda = v => v.itens.reduce((s, i) => s + i.qtd, 0);
const iniciais = n => n.trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase();

// ---------- ui base ----------
const $ = s => document.querySelector(s);
const app = $('#app');
let aba = 'vendas', filtroVendas = 'hoje', periodoRel = 'mes', buscaCli = '';
const titulos = { vendas: 'Vendas', clientes: 'Clientes', produtos: 'Brownies', gastos: 'Gastos', relatorios: 'Relatórios' };

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800); }
let rafAbrir, timerFechar;
function abrir(html) {
  const s = $('#sheet'); s.innerHTML = '<div class="grip"></div>' + html;
  clearTimeout(timerFechar); $('#sheetBg').style.display = 'block';
  if (!s.classList.contains('open')) { cancelAnimationFrame(rafAbrir); rafAbrir = requestAnimationFrame(() => s.classList.add('open')); }
}
function fechar() {
  cancelAnimationFrame(rafAbrir); $('#sheet').classList.remove('open');
  timerFechar = setTimeout(() => $('#sheetBg').style.display = 'none', 250);
}
$('#sheetBg').onclick = fechar;

document.querySelectorAll('nav button').forEach(b => b.onclick = () => { aba = b.dataset.tab; render(); window.scrollTo(0, 0); });
$('#fab').onclick = () => ({ vendas: formVenda, clientes: formCliente, produtos: formProduto, gastos: formGasto })[aba]?.();

function render() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === aba));
  $('#titulo').textContent = titulos[aba];
  $('#fab').style.display = aba === 'relatorios' ? 'none' : 'block';
  ({ vendas: telaVendas, clientes: telaClientes, produtos: telaProdutos, gastos: telaGastos, relatorios: telaRelatorios })[aba]();
}

// ---------- períodos ----------
function noPeriodo(iso, p) {
  const h = hojeISO();
  if (p === 'hoje') return iso === h;
  if (p === 'semana') { const d = new Date(h + 'T12:00'); d.setDate(d.getDate() - 6); return iso >= d.toISOString().slice(0, 10) && iso <= h; }
  if (p === 'mes') return iso.slice(0, 7) === h.slice(0, 7);
  if (p === 'ano') return iso.slice(0, 4) === h.slice(0, 4);
  return true;
}
const seg = (opts, atual, fn) => `<div class="seg">${opts.map(([k, l]) => `<button class="${k === atual ? 'on' : ''}" onclick="${fn}('${k}')">${l}</button>`).join('')}</div>`;

// ---------- VENDAS ----------
function telaVendas() {
  const lista = db.vendas.filter(v => noPeriodo(v.data, filtroVendas)).sort((a, b) => (b.data + b.criado).localeCompare(a.data + a.criado));
  const total = lista.reduce((s, v) => s + totalVenda(v), 0), qtd = lista.reduce((s, v) => s + qtdVenda(v), 0);
  app.innerHTML = seg([['hoje', 'Hoje'], ['semana', '7 dias'], ['mes', 'Mês'], ['tudo', 'Tudo']], filtroVendas, 'setFiltroVendas') +
    `<div class="card row between"><div><div class="muted">Vendido</div><div class="big">${brl(total)}</div></div>
     <div style="text-align:right"><div class="muted">Brownies</div><div class="big">${qtd}</div></div></div>` +
    (lista.length ? `<div class="card list">${lista.map(v => {
      const c = cli(v.clienteId);
      return `<div class="item" onclick="formVenda('${v.id}')">
        <div class="av">${c ? esc(iniciais(c.nome)) : '🍫'}</div>
        <div class="grow"><div class="t">${c ? esc(c.nome) : 'Venda avulsa'}</div>
          <div class="muted">${v.itens.map(i => `${i.qtd}× ${esc(prod(i.produtoId)?.nome || i.nome)}`).join(', ')}</div>
          <div class="muted">${dataBR(v.data)}${c && endereco(c) ? ' · ' + esc(endereco(c)) : ''}</div></div>
        <div style="text-align:right"><div class="t">${brl(totalVenda(v))}</div>
          <span class="tag ${v.pago ? 'ok' : 'fiado'}">${v.pago ? 'PAGO' : 'A RECEBER'}</span></div></div>`;
    }).join('')}</div>` : `<div class="empty"><div class="logo">doce fase</div>Nenhuma venda nesse período.<br>Toque no <b>+</b> para registrar.</div>`);
}
function setFiltroVendas(f) { filtroVendas = f; render(); }

let rascunho;
function formVenda(id) {
  const v = id ? db.vendas.find(x => x.id === id) : null;
  rascunho = v ? JSON.parse(JSON.stringify(v)) : { id: uid(), data: hojeISO(), clienteId: '', itens: [], pago: true, pagamento: 'Pix', obs: '' };
  desenharVenda(!!v);
}
function desenharVenda(editando) {
  const r = rascunho;
  const ativos = db.produtos.filter(p => p.ativo || r.itens.some(i => i.produtoId === p.id));
  const q = pid => r.itens.find(i => i.produtoId === pid)?.qtd || 0;
  const clientes = [...db.clientes].sort((a, b) => a.nome.localeCompare(b.nome));
  abrir(`<h3>${editando ? 'Editar venda' : 'Nova venda'}</h3>
    <label>Cliente</label>
    <div class="row"><select id="vCli" onchange="rascunho.clienteId=this.value">
      <option value="">Venda avulsa (sem cliente)</option>
      ${clientes.map(c => `<option value="${c.id}" ${c.id === r.clienteId ? 'selected' : ''}>${esc(c.nome)}${endereco(c) ? ' — ' + esc(endereco(c)) : ''}</option>`).join('')}
    </select><button class="btn sec mini" onclick="formCliente(null,true)">+ Novo</button></div>
    <label>Brownies</label>
    <div class="list">${ativos.map(p => `<div class="item"><div class="grow"><div class="t">${esc(p.nome)}</div><div class="muted">${brl(precoNoRascunho(p))}</div></div>
      <div class="qty"><button onclick="mudaQtd('${p.id}',-1)">−</button><b>${q(p.id)}</b><button onclick="mudaQtd('${p.id}',1)">+</button></div></div>`).join('')}</div>
    <div class="total-line"><span>Total</span><span>${brl(totalVenda(r))}</span></div>
    <div class="grid2">
      <div><label>Data</label><input type="date" value="${r.data}" onchange="rascunho.data=this.value"></div>
      <div><label>Pagamento</label><select onchange="rascunho.pagamento=this.value">${['Pix', 'Dinheiro', 'Cartão'].map(o => `<option ${o === r.pagamento ? 'selected' : ''}>${o}</option>`).join('')}</select></div>
    </div>
    <label>Status</label>
    <div class="seg"><button class="${r.pago ? 'on' : ''}" onclick="rascunho.pago=true;desenharVenda(${editando})">Pago</button>
      <button class="${!r.pago ? 'on' : ''}" onclick="rascunho.pago=false;desenharVenda(${editando})">A receber</button></div>
    <label>Observação</label><input value="${esc(r.obs)}" onchange="rascunho.obs=this.value" placeholder="Opcional">
    <div style="height:16px"></div>
    <button class="btn" onclick="salvarVenda()">Salvar venda</button>
    ${editando ? `<div style="height:10px"></div><button class="btn perigo" onclick="apagar('vendas','${r.id}')">Excluir venda</button>` : ''}`);
}
function precoNoRascunho(p) { return rascunho.itens.find(i => i.produtoId === p.id)?.preco ?? p.preco; }
function mudaQtd(pid, d) {
  const sel = $('#vCli'); if (sel) rascunho.clienteId = sel.value;
  let it = rascunho.itens.find(i => i.produtoId === pid);
  if (!it) { const p = prod(pid); it = { produtoId: pid, nome: p.nome, preco: p.preco, qtd: 0 }; rascunho.itens.push(it); }
  it.qtd = Math.max(0, it.qtd + d);
  rascunho.itens = rascunho.itens.filter(i => i.qtd > 0);
  const top = $('#sheet').scrollTop;
  desenharVenda(db.vendas.some(v => v.id === rascunho.id));
  $('#sheet').scrollTop = top;
}
function salvarVenda() {
  if (!rascunho.itens.length) return toast('Adicione pelo menos 1 brownie');
  rascunho.criado ||= new Date().toISOString();
  const i = db.vendas.findIndex(v => v.id === rascunho.id);
  if (i >= 0) db.vendas[i] = rascunho; else db.vendas.push(rascunho);
  salvar(); fechar(); render(); toast('Venda salva 🍫');
}

// ---------- CLIENTES ----------
function telaClientes() {
  app.innerHTML = `<input class="search" placeholder="Buscar por nome, bloco ou apto" value="${esc(buscaCli)}" oninput="buscaCli=this.value;telaClientesLista()">
    <div id="cliLista"></div>`;
  telaClientesLista();
}
function telaClientesLista() {
  const termo = buscaCli.toLowerCase();
  const lista = db.clientes.filter(c => !termo || (c.nome + ' ' + endereco(c)).toLowerCase().includes(termo)).sort((a, b) => a.nome.localeCompare(b.nome));
  $('#cliLista').innerHTML = lista.length ? `<div class="card list">${lista.map(c => {
    const vs = db.vendas.filter(v => v.clienteId === c.id), aberto = vs.filter(v => !v.pago).reduce((s, v) => s + totalVenda(v), 0);
    return `<div class="item" onclick="verCliente('${c.id}')"><div class="av">${esc(iniciais(c.nome))}</div>
      <div class="grow"><div class="t">${esc(c.nome)}</div><div class="muted">${esc(endereco(c)) || 'Sem endereço'} · ${vs.length} compra${vs.length === 1 ? '' : 's'}</div></div>
      ${aberto ? `<span class="tag fiado">${brl(aberto)}</span>` : ''}</div>`;
  }).join('')}</div>` : `<div class="empty"><div class="logo">doce fase</div>${db.clientes.length ? 'Ninguém encontrado.' : 'Nenhum cliente ainda.<br>Toque no <b>+</b> para cadastrar.'}</div>`;
}
function verCliente(id) {
  const c = cli(id), vs = db.vendas.filter(v => v.clienteId === id).sort((a, b) => b.data.localeCompare(a.data));
  const total = vs.reduce((s, v) => s + totalVenda(v), 0), aberto = vs.filter(v => !v.pago).reduce((s, v) => s + totalVenda(v), 0);
  abrir(`<div class="row"><div class="av">${esc(iniciais(c.nome))}</div><div class="grow"><h3>${esc(c.nome)}</h3><div class="muted">${esc(endereco(c))}${c.tel ? ' · ' + esc(c.tel) : ''}</div></div></div>
    <div class="grid2" style="margin-top:14px"><div class="stat" style="background:var(--creme)"><div class="muted">Total comprado</div><div class="v">${brl(total)}</div></div>
      <div class="stat" style="background:var(--creme)"><div class="muted">A receber</div><div class="v" style="color:${aberto ? 'var(--laranja)' : 'var(--verde)'}">${brl(aberto)}</div></div></div>
    ${aberto ? `<div style="height:10px"></div><button class="btn sec" onclick="quitar('${id}')">Marcar tudo como pago</button>` : ''}
    <h2>Compras</h2>
    ${vs.length ? `<div class="list">${vs.map(v => `<div class="item" onclick="formVenda('${v.id}')"><div class="grow"><div class="t">${dataBR(v.data)}</div>
      <div class="muted">${v.itens.map(i => `${i.qtd}× ${esc(prod(i.produtoId)?.nome || i.nome)}`).join(', ')}</div></div>
      <div style="text-align:right"><div class="t">${brl(totalVenda(v))}</div><span class="tag ${v.pago ? 'ok' : 'fiado'}">${v.pago ? 'PAGO' : 'A RECEBER'}</span></div></div>`).join('')}</div>` : '<div class="muted">Nenhuma compra ainda.</div>'}
    <div style="height:16px"></div>
    <button class="btn" onclick="formVendaPara('${id}')">Nova venda para ${esc(c.nome.split(' ')[0])}</button>
    <div style="height:10px"></div>
    <button class="btn sec" onclick="formCliente('${id}')">Editar cliente</button>`);
}
function formVendaPara(id) { formVenda(); rascunho.clienteId = id; desenharVenda(false); }
function quitar(id) { db.vendas.forEach(v => { if (v.clienteId === id) v.pago = true; }); salvar(); verCliente(id); render(); toast('Tudo pago ✔'); }
let voltarParaVenda = false;
function formCliente(id, daVenda) {
  voltarParaVenda = !!daVenda;
  const c = id ? cli(id) : { nome: '', bloco: '', apto: '', tel: '' };
  abrir(`<h3>${id ? 'Editar cliente' : 'Novo cliente'}</h3>
    <label>Nome</label><input id="cNome" value="${esc(c.nome)}" placeholder="Ex.: Ana Paula">
    <div class="grid2"><div><label>Bloco</label><input id="cBloco" value="${esc(c.bloco)}" placeholder="Ex.: B"></div>
      <div><label>Apartamento</label><input id="cApto" value="${esc(c.apto)}" inputmode="numeric" placeholder="Ex.: 302"></div></div>
    <label>WhatsApp (opcional)</label><input id="cTel" value="${esc(c.tel)}" inputmode="tel" placeholder="(11) 99999-9999">
    <div style="height:16px"></div>
    <button class="btn" onclick="salvarCliente('${id || ''}')">Salvar</button>
    ${id ? `<div style="height:10px"></div><button class="btn perigo" onclick="apagar('clientes','${id}')">Excluir cliente</button>` : ''}`);
  setTimeout(() => $('#cNome')?.focus(), 300);
}
function salvarCliente(id) {
  const dados = { nome: $('#cNome').value.trim(), bloco: $('#cBloco').value.trim(), apto: $('#cApto').value.trim(), tel: $('#cTel').value.trim() };
  if (!dados.nome) return toast('Coloque o nome');
  let novoId = id;
  if (id) Object.assign(cli(id), dados); else { novoId = uid(); db.clientes.push({ id: novoId, ...dados }); }
  salvar(); toast('Cliente salvo');
  if (voltarParaVenda && rascunho) { rascunho.clienteId = novoId; desenharVenda(db.vendas.some(v => v.id === rascunho.id)); }
  else { fechar(); }
  render();
}

// ---------- PRODUTOS ----------
function telaProdutos() {
  app.innerHTML = `<div class="card list">${db.produtos.map(p => {
    const vendidos = db.vendas.reduce((s, v) => s + v.itens.filter(i => i.produtoId === p.id).reduce((a, i) => a + i.qtd, 0), 0);
    return `<div class="item" onclick="formProduto('${p.id}')" style="${p.ativo ? '' : 'opacity:.5'}"><div class="av">🍫</div>
      <div class="grow"><div class="t">${esc(p.nome)}</div><div class="muted">${vendidos} vendido${vendidos === 1 ? '' : 's'}${p.ativo ? '' : ' · fora do cardápio'}</div></div>
      <div class="t">${brl(p.preco)}</div></div>`;
  }).join('')}</div>
  <div class="muted" style="text-align:center;margin:6px 0 20px">Toque em um sabor para mudar preço ou nome.</div>
  <h2>Backup</h2>
  <div class="card"><div class="muted" style="margin-bottom:10px">Os dados ficam salvos só neste celular. Faça um backup de vez em quando pra não perder nada.</div>
    <div class="grid2"><button class="btn sec" onclick="exportar()">Salvar backup</button>
    <button class="btn sec" onclick="$('#arqImport').click()">Restaurar</button></div>
    <input type="file" id="arqImport" accept=".json,application/json" style="display:none" onchange="importar(this.files[0])"></div>`;
}
function formProduto(id) {
  const p = id ? prod(id) : { nome: '', preco: '', ativo: true };
  abrir(`<h3>${id ? 'Editar sabor' : 'Novo sabor'}</h3>
    <label>Nome</label><input id="pNome" value="${esc(p.nome)}" placeholder="Ex.: Nutella">
    <label>Preço (R$)</label><input id="pPreco" value="${p.preco === '' ? '' : String(p.preco).replace('.', ',')}" inputmode="decimal" placeholder="10,00">
    <label>No cardápio?</label>
    <div class="seg" id="pAtivo" data-v="${p.ativo ? 1 : 0}"><button class="${p.ativo ? 'on' : ''}" onclick="togAtivo(1)">Sim, vendendo</button><button class="${!p.ativo ? 'on' : ''}" onclick="togAtivo(0)">Pausado</button></div>
    <div class="muted">Mudar o preço não altera vendas já registradas.</div>
    <div style="height:16px"></div>
    <button class="btn" onclick="salvarProduto('${id || ''}')">Salvar</button>
    ${id ? `<div style="height:10px"></div><button class="btn perigo" onclick="apagar('produtos','${id}')">Excluir sabor</button>` : ''}`);
}
function togAtivo(v) { const s = $('#pAtivo'); s.dataset.v = v; s.children[0].classList.toggle('on', v == 1); s.children[1].classList.toggle('on', v == 0); }
function salvarProduto(id) {
  const dados = { nome: $('#pNome').value.trim(), preco: num($('#pPreco').value), ativo: $('#pAtivo').dataset.v === '1' };
  if (!dados.nome) return toast('Coloque o nome do sabor');
  if (id) Object.assign(prod(id), dados); else db.produtos.push({ id: uid(), ...dados });
  salvar(); fechar(); render(); toast('Sabor salvo');
}

// ---------- GASTOS ----------
const CATEGORIAS = ['Ingredientes', 'Embalagens', 'Gás/Energia', 'Utensílios', 'Entrega', 'Outros'];
let filtroGastos = 'mes';
function setFiltroGastos(f) { filtroGastos = f; render(); }
function telaGastos() {
  const lista = db.gastos.filter(g => noPeriodo(g.data, filtroGastos)).sort((a, b) => b.data.localeCompare(a.data));
  const total = lista.reduce((s, g) => s + g.valor, 0);
  app.innerHTML = seg([['semana', '7 dias'], ['mes', 'Mês'], ['ano', 'Ano'], ['tudo', 'Tudo']], filtroGastos, 'setFiltroGastos') +
    `<div class="card"><div class="muted">Gasto no período</div><div class="big">${brl(total)}</div></div>` +
    (lista.length ? `<div class="card list">${lista.map(g => `<div class="item" onclick="formGasto('${g.id}')">
      <div class="grow"><div class="t">${esc(g.desc)}</div><div class="muted">${dataBR(g.data)} · ${esc(g.cat)}</div></div>
      <div class="t">${brl(g.valor)}</div></div>`).join('')}</div>`
      : `<div class="empty"><div class="logo">doce fase</div>Nenhum gasto nesse período.<br>Toque no <b>+</b> para registrar uma compra.</div>`);
}
function formGasto(id) {
  const g = id ? db.gastos.find(x => x.id === id) : { desc: '', valor: '', cat: 'Ingredientes', data: hojeISO() };
  abrir(`<h3>${id ? 'Editar gasto' : 'Novo gasto'}</h3>
    <label>O que comprou?</label><input id="gDesc" value="${esc(g.desc)}" placeholder="Ex.: Leite condensado (6 un)">
    <div class="grid2"><div><label>Valor (R$)</label><input id="gValor" value="${g.valor === '' ? '' : String(g.valor).replace('.', ',')}" inputmode="decimal" placeholder="0,00"></div>
      <div><label>Data</label><input id="gData" type="date" value="${g.data}"></div></div>
    <label>Categoria</label><select id="gCat">${CATEGORIAS.map(c => `<option ${c === g.cat ? 'selected' : ''}>${c}</option>`).join('')}</select>
    <div style="height:16px"></div>
    <button class="btn" onclick="salvarGasto('${id || ''}')">Salvar</button>
    ${id ? `<div style="height:10px"></div><button class="btn perigo" onclick="apagar('gastos','${id}')">Excluir gasto</button>` : ''}`);
}
function salvarGasto(id) {
  const dados = { desc: $('#gDesc').value.trim(), valor: num($('#gValor').value), cat: $('#gCat').value, data: $('#gData').value || hojeISO() };
  if (!dados.desc) return toast('Descreva o gasto');
  if (!dados.valor) return toast('Coloque o valor');
  if (id) Object.assign(db.gastos.find(x => x.id === id), dados); else db.gastos.push({ id: uid(), ...dados });
  salvar(); fechar(); render(); toast('Gasto salvo');
}

// ---------- RELATÓRIOS ----------
function setPeriodoRel(p) { periodoRel = p; render(); }
function telaRelatorios() {
  const vs = db.vendas.filter(v => noPeriodo(v.data, periodoRel)), gs = db.gastos.filter(g => noPeriodo(g.data, periodoRel));
  const receita = vs.reduce((s, v) => s + totalVenda(v), 0), qtd = vs.reduce((s, v) => s + qtdVenda(v), 0);
  const gasto = gs.reduce((s, g) => s + g.valor, 0), lucro = receita - gasto;
  const aReceber = db.vendas.filter(v => !v.pago).reduce((s, v) => s + totalVenda(v), 0);
  const clientesUnicos = new Set(vs.filter(v => v.clienteId).map(v => v.clienteId)).size;

  // por sabor
  const porSabor = {};
  vs.forEach(v => v.itens.forEach(i => { const n = prod(i.produtoId)?.nome || i.nome; porSabor[n] = (porSabor[n] || 0) + i.qtd; }));
  const sabores = Object.entries(porSabor).sort((a, b) => b[1] - a[1]), maxS = sabores[0]?.[1] || 1;

  // melhores clientes
  const porCli = {};
  vs.filter(v => v.clienteId).forEach(v => porCli[v.clienteId] = (porCli[v.clienteId] || 0) + totalVenda(v));
  const top = Object.entries(porCli).sort((a, b) => b[1] - a[1]).slice(0, 5);

  // gráfico
  let barras = '', legenda = '';
  const h = hojeISO();
  if (periodoRel === 'ano') {
    const meses = Array.from({ length: 12 }, (_, m) => vs.filter(v => +v.data.slice(5, 7) === m + 1).reduce((s, v) => s + totalVenda(v), 0));
    const mx = Math.max(...meses, 1), mAtual = +h.slice(5, 7);
    barras = meses.map((x, m) => `<div class="${m + 1 === mAtual ? 'hoje' : ''}" style="height:${x / mx * 100}%" title="${brl(x)}"></div>`).join('');
    legenda = 'Vendas por mês (jan → dez)';
  } else if (periodoRel !== 'hoje') {
    const dias = periodoRel === 'semana' ? 7 : +h.slice(8, 10);
    const lista = Array.from({ length: dias }, (_, k) => { const d = new Date(h + 'T12:00'); d.setDate(d.getDate() - (dias - 1 - k)); const iso = d.toISOString().slice(0, 10); return db.vendas.filter(v => v.data === iso).reduce((s, v) => s + totalVenda(v), 0); });
    const mx = Math.max(...lista, 1);
    barras = lista.map((x, k) => `<div class="${k === dias - 1 ? 'hoje' : ''}" style="height:${x / mx * 100}%" title="${brl(x)}"></div>`).join('');
    legenda = periodoRel === 'semana' ? 'Vendas por dia (últimos 7 dias)' : 'Vendas por dia neste mês';
  }

  app.innerHTML = seg([['hoje', 'Hoje'], ['semana', '7 dias'], ['mes', 'Mês'], ['ano', 'Ano']], periodoRel, 'setPeriodoRel') +
    `<div class="grid2">
      <div class="stat"><div class="muted">Vendido</div><div class="v">${brl(receita)}</div></div>
      <div class="stat"><div class="muted">Brownies</div><div class="v">${qtd}</div></div>
      <div class="stat"><div class="muted">Gastos</div><div class="v">${brl(gasto)}</div></div>
      <div class="stat ${lucro >= 0 ? 'verde' : ''}"><div class="muted">Lucro</div><div class="v">${brl(lucro)}</div></div>
      <div class="stat"><div class="muted">Vendas</div><div class="v">${vs.length}</div></div>
      <div class="stat"><div class="muted">Clientes</div><div class="v">${clientesUnicos}</div></div>
    </div>
    ${qtd ? `<div class="muted" style="margin:10px 2px 0">Ticket médio ${brl(receita / vs.length)} · ${brl(receita / qtd)} por brownie</div>` : ''}
    ${aReceber ? `<div class="card" style="margin-top:12px;border-left:4px solid var(--laranja)"><div class="row between"><div><div class="muted">A receber (total)</div><div class="big" style="color:var(--laranja)">${brl(aReceber)}</div></div>
      <button class="btn sec mini" onclick="verAReceber()">Ver quem</button></div></div>` : ''}
    ${barras ? `<h2>Evolução</h2><div class="card"><div class="muted">${legenda}</div><div class="chart">${barras}</div></div>` : ''}
    <h2>Sabores mais vendidos</h2>
    <div class="card">${sabores.length ? sabores.map(([n, q]) => `<div style="margin-bottom:10px"><div class="row between"><span>${esc(n)}</span><b>${q}</b></div><div class="bar"><i style="width:${q / maxS * 100}%"></i></div></div>`).join('') : '<div class="muted">Sem vendas nesse período.</div>'}</div>
    <h2>Melhores clientes</h2>
    <div class="card list">${top.length ? top.map(([id, v], k) => { const c = cli(id); return c ? `<div class="item" onclick="verCliente('${id}')"><div class="av">${k + 1}º</div><div class="grow"><div class="t">${esc(c.nome)}</div><div class="muted">${esc(endereco(c))}</div></div><b>${brl(v)}</b></div>` : ''; }).join('') : '<div class="muted">Sem vendas com cliente nesse período.</div>'}</div>`;
}
function verAReceber() {
  const porCli = {};
  db.vendas.filter(v => !v.pago).forEach(v => { const k = v.clienteId || '_'; porCli[k] = (porCli[k] || 0) + totalVenda(v); });
  abrir(`<h3>A receber</h3><div class="list">${Object.entries(porCli).sort((a, b) => b[1] - a[1]).map(([id, v]) => {
    const c = cli(id);
    return `<div class="item" ${c ? `onclick="verCliente('${id}')"` : ''}><div class="av">${c ? esc(iniciais(c.nome)) : '?'}</div><div class="grow"><div class="t">${c ? esc(c.nome) : 'Vendas avulsas'}</div><div class="muted">${c ? esc(endereco(c)) : ''}</div></div><b style="color:var(--laranja)">${brl(v)}</b></div>`;
  }).join('')}</div>`);
}

// ---------- excluir / backup ----------
function apagar(col, id) {
  const nomes = { vendas: 'esta venda', clientes: 'este cliente', produtos: 'este sabor', gastos: 'este gasto' };
  let aviso = `Excluir ${nomes[col]}?`;
  if (col === 'clientes' && db.vendas.some(v => v.clienteId === id)) aviso += '\n\nAs vendas dele continuam, mas ficam como "avulsas".';
  if (col === 'produtos' && db.vendas.some(v => v.itens.some(i => i.produtoId === id))) aviso += '\n\nDica: se ele já foi vendido, é melhor só "Pausar" pra manter o histórico certinho.';
  if (!confirm(aviso)) return;
  db[col] = db[col].filter(x => x.id !== id);
  if (col === 'clientes') db.vendas.forEach(v => { if (v.clienteId === id) v.clienteId = ''; });
  salvar(); fechar(); render(); toast('Excluído');
}
function exportar() {
  const blob = new Blob([JSON.stringify(db, null, 1)], { type: 'application/json' });
  const nome = `docefase-backup-${hojeISO()}.json`;
  const arq = new File([blob], nome, { type: 'application/json' });
  if (navigator.canShare?.({ files: [arq] })) { navigator.share({ files: [arq], title: 'Backup Doce Fase' }).catch(() => {}); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; a.click();
}
function importar(f) {
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.produtos) || !Array.isArray(d.vendas)) throw 0;
      if (!confirm('Substituir os dados atuais pelos do backup?')) return;
      db = { produtos: d.produtos, clientes: d.clientes || [], vendas: d.vendas, gastos: d.gastos || [] };
      salvar(); render(); toast('Backup restaurado');
    } catch { toast('Arquivo de backup inválido'); }
  };
  r.readAsText(f);
}

render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
if (navigator.storage?.persist) navigator.storage.persist();
</script>
</body>
</html>
